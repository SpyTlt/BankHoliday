name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore BankHoliday.slnx

    - name: Build
      run: dotnet build BankHoliday.slnx --no-restore -c Release

    - name: Test
      run: dotnet test BankHoliday.slnx --no-build -c Release --verbosity normal
